<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroToggle | Automation Experts</title>

    <meta name="description" content="We help you spend time on things that you like by automating tasks that matter.">

    <link rel="icon" href="favicon.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&display=swap" rel="stylesheet">

    <script src="https://kit.fontawesome.com/088b0b403f.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="assets/css/main.css">

    <meta name="theme-color" content="#884488" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#884488" media="(prefers-color-scheme: dark)">

    <style>
        /* Theme */
        :root
        {
            --accent: #884488;
            --accent64: #884488a3;
        }
        .accentText
        {
            color: var(--accent);
        }
        .accentBackground
        {
            background-color: var(--accent);
        }
        a:active, a:hover
        {
            color: #999999;
        }

        /* Shared classes */
        .defAlignemnt
        {
            padding-left: 128px;
            padding-right: 128px;
        }
        @media (orientation: portrait)
        {
            .defAlignemnt
            {
                padding-left: 16px;
                padding-right: 16px;
            }
        }
        .defSection
        {
            padding-top: 32px;
            padding-bottom: 32px;
        }
        @media (orientation: portrait)
        {
            .defSection
            {
                padding-top: 32px;
                padding-bottom: 16px;
            }
        }
        .defCTA
		{
			color: var(--accent);
			border: 4px solid var(--accent);

			padding: 8px;
			padding-left: 20px;
			padding-right: 20px;

			font-size: 1.2rem;
			font-weight: 800;
		}
		.defCTA:active, .defCTA:hover
		{
			color: #ffffff;
			background-color: var(--accent);
		}
		.primaryCTA
		{
			color: #ffffff;
			background-color: var(--accent);
		}
		.primaryCTA:active, .primaryCTA:hover
		{
			color: var(--accent);
			background-color: initial;
		}

        /* Everything Else */
        header
        {
            background-color: var(--accent64);
        }
        .headerLogo
        {
            margin: 0;
            border: none;
            padding: 4px;

            background-color: var(--accent);
            display: inline-block;
        }
        .headerLogo:active, .headerLogo:hover
        {
            background-color: var(--accent64);
        }
        .headerLogo img
        {
            height: 60px;
            padding: 2px;
        }
        .headerNav
        {
            float: right;
			margin-top: 24px;
        }
        .headerNav a:active, .headerNav a:hover
        {
            color: #ffffff;
        }

        main
        {
            padding-top: 32px;
            padding-bottom: 32px;
        }
        @media (orientation: portrait)
        {
            main
            {
                padding-top: 16px;
            }
        }
        .cover
        {
            display: block;
            overflow: auto;
        }
        .coverImg
        {
            border: 12px solid var(--accent);
            outline: 16px solid var(--accent64); /* Outer "border" */
            outline-offset: 0px; /* Space between border and outline */
            border-radius: 32px;
           display: none;
        }
        @media (orientation: landscape)
        {
            .coverImg
            {
                display: block;
                float: right;
                max-width: 50vh;
                margin: 16px;
            }
        }
        .coverCTA
		{
			display: flex;
			gap: 16px;
		}
		.coverCTA li
		{
			margin-bottom: 16px;
		}
		@media (orientation: portrait)
		{
			.coverCTA
			{
				flex-direction: column;
			}
		}
		.coverCTA li
		{
			display: inline-block;
		}
        .services
        {
            background-color: var(--accent64);

            color: #ffffff;

			padding-top: 32px;
        }
        .serviceBoxes
        {
            display: flex;
            gap: 0px;
        }
        .serviceBoxes img
        {
            width: 100%;
        }
        @media (orientation: portrait)
		{
			.serviceBoxes
			{
				flex-direction: column;
                gap: 4px;
			}
		}
        .serviceBoxes article
        {
            display: inline-block;
            padding: 8px;
			flex: 1;
        }
		.serviceBoxes article:nth-child(odd)
		{
			background-color: var(--accent64);
		}
        .serviceBoxes article:nth-child(even)
        {
            background-color: var(--accent);
            padding-left: 8px;
            padding-right: 8px;
        }
        @media (orientation: portrait)
		{
            .serviceBoxes article, .serviceBoxes article:nth-child(even)
            {
                padding: 8px;
            }
        }
        .promoBanner
        {
            background-color: var(--accent);
            color: #DDDDDD;
            padding: 16px;

			margin-top: 32px;
			margin-bottom: 32px;
        }
        .products
        {
            display: block;
        }
		.products img
		{
			width: 100%;
		}
        .productBoxes
        {
            display: flex;
            gap: 128px;
        }
        @media (orientation: portrait)
		{
			.productBoxes
			{
				flex-direction: column;
				gap: 16px;
			}
		}
        .productBoxes article
        {
            display: inline-block;
            padding: 8px;
            padding-bottom: 16px;

            border: solid var(--accent64);
            border-width: 0 0 4px 0;

            outline: 2px solid var(--accent64);
            outline-offset: 0px;
			flex: 1;

			margin-top: 32px;
			margin-bottom: 16px;
        }
        .productBoxes article p
        {
            color: var(--accent);
        }
        .productBoxes article:active p, .productBoxes article:hover p
        {
            color: inherit;
        }
		.productBoxes article:active, .productBoxes article:hover
		{
			border-color: var(--accent);
            outline: 2px solid var(--accent);
		}
        .productBoxes article:active a, .productBoxes article:hover a
		{
			color: var(--accent);
		}
		.productBoxes a:active, .productBoxes a:hover
		{
			color: var(--accent64);
		}
        .contactForm
        {
            display: block;
			color: var(--accent);
        }
        .contactForm input, .contactForm textarea
        {
            font-family: inherit;
            font-weight: 600;
        }
        .contactFormInput, .contactFormInputRow
        {
            display: flex;
            gap: 16px;
			flex-direction: column;
        }
		.contactFormInputRow
		{
			flex-direction: row;
		}
		@media (orientation: portrait)
		{
			.contactFormInputRow
			{
				flex-direction: column;
			}
		}
		.contactFormInputRow input
		{
			flex: auto;
		}
        .contactFormInput input, .contactFormInput textarea
        {
			flex: auto;
            border: 2px solid var(--accent64);
            padding: 8px;
            background-color: #ffffff00;
            border-radius: 0;
            outline: none;
        }
        .contactFormInput input:focus, .contactFormInput textarea:focus
        {
            border-color: var(--accent);
            background-color: #ffffff;
        }
		.contactForm textarea
		{
			resize: vertical;
			min-height: 128px;
		}
        .contactForm button
        {
            display: inline-block;
			margin-top: 16px;
        }

        footer
        {
            padding-top: 32px;
            padding-bottom: 8px;
            background-color: var(--accent);
        }
        .footerSocials
		{
			display: flex;
			gap: 8px;
		}
		.footerSocials li
		{
			display: inline-block;
		}
		.footerSocials a
		{
			line-height: 1;
			display: inline-block;
			padding: 8px;
		}
		.footerSocials i
		{
			display: inline-block;
			aspect-ratio: 1/1;
		}
        .footerSocials .defCTA
        {
            color: #ffffff;
            border-color: #ffffff;
        }
        .footerSocials .defCTA:active, .footerSocials .defCTA:hover
        {
            color: var(--accent64);
            background-color: #ffffff;
            border-color: var(--accent64);
        }
		.copyrightNotice
		{
			padding-top: 16px;
			padding-bottom: 8px;
			font-size: 1rem;
            color: #ffffff;
		}
        header, footer
        {
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <div class="defAlignemnt">
            <a href="https://retrotoggle.com/" class="headerLogo">
                <img src="assets/media/RetroToggle.svg" alt="">
            </a>

            <div class="headerNav">
                <a href="#" class="defCTA primaryCTA" target="_blank">
                    SHOP
                </a>
            </div>
        </div>
    </header>

    <main>
        <div class="defSection defAlignemnt">
            <h1>
                Coming Soon...
            </h1>

            <h2>
                We are working on something <span class="accentText">awesome</span>!
            </h2>

            <br><br>

            <a href="https://retrotoggle.com/" class="defCTA primaryCTA">HOME</a>
        </div>
    </main>

    <footer>
        <div class="defAlignemnt">
            <ul class="footerSocials">
				<li>
					<a href="https://www.instagram.com/retrotoggle/" target="_blank" class="defCTA">
						<i class="fa-brands fa-instagram"></i>
					</a>
				</li>
                <li>
					<a href="https://www.x.com/retrotoggle/" target="_blank" class="defCTA">
						<i class="fa-brands fa-x-twitter"></i>
					</a>
				</li>
                <li>
					<a href="https://www.facebook.com/retrotoggle/" target="_blank" class="defCTA">
						<i class="fa-brands fa-facebook"></i>
					</a>
				</li>
				<li>
					<a href="https://www.linkedin.com/company/retrotoggle/" target="_blank" class="defCTA">
						<i class="fa-brands fa-linkedin-in"></i>
					</a>
				</li>
			</ul>

            <p class="copyrightNotice">
                &copy 2025 RetroToggle.
            </p>
        </div>
    </footer>

	<script src="assets/js/contactForm.js"></script>
</body>
</html>
