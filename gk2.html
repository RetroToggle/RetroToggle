<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RetroToggle</title>
<style>
  :root { --p: #884488; --pd: #6b3470; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: system-ui, sans-serif; line-height: 1.5; color: #111; }

  header {
    background: var(--p);
    color: white;
    text-align: center;
    padding: 4rem 2rem 6rem;
  }
  .logo { height: 60px; image-rendering: pixelated; margin-bottom: 2rem; }
  h1 { font-size: 4.8rem; font-weight: 900; letter-spacing: -4px; margin-bottom: .5rem; }
  .subtitle { font-size: 1.7rem; opacity: .95; margin-bottom: 4rem; }
  .buttons a {
    display: inline-block;
    background: white;
    color: var(--p);
    padding: 1rem 3rem;
    margin: 0 1rem;
    font-weight: bold;
    font-size: 1.4rem;
    text-decoration: none;
    border: 4px solid white;
    transition: .3s;
  }
  .buttons a:hover { background: transparent; color: white; }

  .services {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 2rem;
    padding: 6rem 5%;
    background: #f9f7fb;
  }
  .services > div {
    background: var(--p);
    color: center;
    color: white;
    padding: 2.5rem;
    font-size: 1.5rem;
    font-weight: 600;
  }

  .consultancy {
    background: var(--pd);
    color: white;
    text-align: center;
    padding: 10rem 5%;
    font-size: 3rem;
    font-weight: 900;
  }

  .products {
    padding: 8rem 5% 6rem;
    text-align: center;
  }
  .products h2 { font-size: 3rem; margin-bottom: 4rem; }
  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 2rem;
  }
  .product-card {
    background: var(--p);
    height: 240px;
    border-radius: 8px;
  }

  .contact {
    background: var(--pd);
    color: white;
    padding: 8rem 5%;
  }
  .contact h2 { font-size: 2.8rem; text-align: center; margin-bottom: 4rem; }
  .form-grid {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
  }
  .form-grid input,
  .form-grid textarea {
    background: rgba(255,255,255,.1);
    border: none;
    padding: 1.2rem;
    font-size: 1.1rem;
    border-radius: 4px;
  }
  .form-grid textarea { grid-column: 1 / -1; height: 160px; resize: none; }
  .form-grid button {
    background: white;
    color: var(--pd);
    border: none;
    padding: 1.2rem 0;
    font-size: 1.3rem;
    font-weight: bold;
    cursor: pointer;
  }

  footer {
    background: var(--pd);
    color: white;
    text-align: center;
    padding: 4rem;
    font-size: 1.5rem;
  }
  footer a { color: white; margin: 0 2rem; text-decoration: none; opacity: .9; }

  @media (max-width: 800px) {
    h1 { font-size: 3.5rem; }
    .buttons a { display: block; margin: 1rem auto; width: 260px; }
    .form-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <img src="https://i.imgur.com/0JqW4uP.png" alt="RetroToggle" class="logo">
  <h1>Automating the World!</h1>
  <p class="subtitle">We give older hardware another chance with our automation magic.</p>
  <div class="buttons">
    <a href="#services">SERVICES</a>
    <a href="#contact">CONTACT</a>
  </div>
</header>

<section class="services" id="services">
  <div>Industrial Automation</div>
  <div>Custom Solutions</div>
  <div>Consultancy</div>
</section>

<section class="consultancy">
  WE OFFER CONSULTANCY
</section>

<section class="products">
  <h2>OUR PRODUCTS</h2>
  <div class="product-grid">
    <div class="product-card"></div>
    <div class="product-card"></div>
    <div class="product-card"></div>
  </div>
</section>

<section class="contact" id="contact">
  <h2>GET IN TOUCH</h2>
  <form class="form-grid">
    <input type="text" placeholder="NAME">
    <input type="email" placeholder="EMAIL">
    <input type="text" placeholder="SUBJECT" style="grid-column:1/-1">
    <textarea placeholder="MESSAGE"></textarea>
    <button type="submit">SEND</button>
  </form>
</section>

<footer>
  <a href="#">in</a>
  <a href="#">f</a>
  <div>© 2025 RetroToggle</div>
</footer>

</body>
</html>
